name: Release

# Tag `vX.Y.Z` (matching package.json, manifest.json and src/version.ts) and
# the bundle plus its checksum land on the GitHub Release. That URL is what
# the Claude Desktop directory submission and Pastea's embedded copy point at.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: scripts/pack.sh
      - name: Check the tag matches the version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          [ "v$VERSION" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != v$VERSION"; exit 1; }
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release create "${GITHUB_REF_NAME}" \
            "build/pastea-mcp-$VERSION.mcpb" build/SHA256SUMS \
            --title "pastea-mcp $VERSION" \
            --notes "Claude Desktop extension for Pastea $VERSION. Download the .mcpb and double-click it, or install Pastea from https://pastea.app and use Settings → MCP & AI Tools → Claude Desktop."
